<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}McOsu AP Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="brand">McOsu<span class="brand-accent">AP</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/players">Players</a>
                {% if logged_in %}
                <a href="/profile?token={{ token }}">Profile</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="footer-inner">
            <span>McOsu AP Tracker</span>
            <span>Track your Activity Points</span>
        </div>
    </footer>
</body>
</html>
