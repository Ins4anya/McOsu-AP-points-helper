<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1220">
    <title>{% block title %}McOsu AP Tracker{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=28">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="brand">McOsu<span class="brand-accent">AP</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/players">Players</a>
                <a href="/ranked">Ranked</a>
                {% if logged_in %}
                <a href="/profile">Profile</a>
                {% endif %}
            </div>
            <div class="size-ctl" id="sizeCtl">
                <button type="button" data-size="16" title="Small">A−</button>
                <button type="button" data-size="0" title="Auto">A₀</button>
                <button type="button" data-size="20" title="Large">A+</button>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="footer-inner">
            <span>McOsu AP Tracker</span>
            <span>Track your Activity Points</span>
        </div>
    </footer>
    <script>
        (function () {
            const KEY = "mcsu_font_size";
            const saved = parseInt(localStorage.getItem(KEY) || "", 10);
            const ctl = document.getElementById("sizeCtl");
            if (!ctl) return;
            const btns = ctl.querySelectorAll("button");
            const sizes = [16, 18, 20];
            let current = sizes.indexOf(saved) >= 0 ? saved : 0;
            function setSize(size) {
                current = size;
                if (size) {
                    document.documentElement.style.fontSize = size + "px";
                    localStorage.setItem(KEY, String(size));
                } else {
                    document.documentElement.style.fontSize = "";
                    localStorage.removeItem(KEY);
                }
                btns.forEach(b => {
                    const v = parseInt(b.dataset.size, 10);
                    b.classList.toggle("on", v === size || (v === 0 && size === 0));
                });
            }
            btns.forEach(b => {
                b.addEventListener("click", () => setSize(parseInt(b.dataset.size, 10)));
            });
            setSize(current);
        })();
    </script>
</body>
</html>
